[package]
name = "lambda-despachador"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_runtime = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "../shared" }
aws-sdk-sqs = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
env_logger = "0.11"

[[bin]]
name = "bootstrap"
path = "src/main.rs"