name: Terraform CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_INPUT: "0"

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Detectar ambiente
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "env_path=terraform/environments/prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
            echo "env_path=terraform/environments/dev" >> $GITHUB_OUTPUT
          fi

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: |
          cd ${{ steps.env.outputs.env_path }}
          terraform init -input=false -backend-config="bucket=truetally-terraform-state" -backend-config="key=${{ steps.env.outputs.env_name }}/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Workspace
        run: |
          cd ${{ steps.env.outputs.env_path }}
          terraform workspace select -or-create ${{ steps.env.outputs.env_name }}

      - name: Terraform FMT (verifica formato)
        run: |
          cd ${{ steps.env.outputs.env_path }}
          terraform fmt -check

      - name: Terraform Validate
        run: |
          cd ${{ steps.env.outputs.env_path }}
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd ${{ steps.env.outputs.env_path }}
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt

      - name: Comentar plan en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ steps.env.outputs.env_path }}';
            const plan = fs.readFileSync(`${path}/plan_output.txt`, 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0,60000) + '...(truncado)' : plan;
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '### Terraform Plan (${{ steps.env.outputs.env_name }})\n```\n' + truncated + '\n```'
            });

      - name: Guardar plan como artefacto
        if: steps.env.outputs.env_name == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: ${{ steps.env.outputs.env_path }}/tfplan
          retention-days: 7

  apply-dev:
    name: Terraform Apply (Dev)
    needs: plan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: |
          cd terraform/environments/dev
          terraform init -input=false -backend-config="bucket=truetally-terraform-state" -backend-config="key=dev/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Workspace
        run: |
          cd terraform/environments/dev
          terraform workspace select -or-create dev

      - name: Descargar plan aprobado
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: terraform/environments/dev/

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: |
          terraform apply -input=false -auto-approve tfplan
