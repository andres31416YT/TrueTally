name: Terraform CI/CD

on:
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main, develop, feature]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init -backend-config="bucket=truetally-terraform-state" -backend-config="key=${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Workspace
        run: terraform workspace select -or-create ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

      - name: Terraform FMT (verifica formato)
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt

      - name: Comentar plan en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0,60000) + '...(truncado)' : plan;
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '### Terraform Plan\n```\n' + truncated + '\n```'
            });

      - name: Guardar plan como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.pull_request.number || github.run_number }}
          path: terraform/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/tfplan
          retention-days: 7

      - name: Upload Terraform Outputs
        if: success()
        run: terraform output -json > terraform-outputs.json

      - name: Upload Outputs Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ github.run_id }}
          path: terraform/environments/${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}/terraform-outputs.json
          retention-days: 30

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://andrespaganroncall.qzz.io
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./terraform/environments/prod

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init -backend-config="bucket=truetally-terraform-state" -backend-config="key=prod/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Workspace
        run: terraform workspace select -or-create prod

      - name: Descargar plan aprobado
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_number }}
          path: terraform/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
