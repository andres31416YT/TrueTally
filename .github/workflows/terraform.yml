name: Terraform CI/CD

on:
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main, develop, feature]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan-dev:
    name: Terraform Plan Dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/feature') || (github.event_name == 'pull_request' && (github.base_ref == 'develop' || startsWith(github.base_ref, 'feature')))
    env:
      TF_INPUT: "0"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=truetally-terraform-state" -backend-config="key=dev/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"
        working-directory: ./terraform/environments/dev

      - name: Terraform Workspace
        run: terraform workspace select -or-create dev
        working-directory: ./terraform/environments/dev

      - name: Terraform FMT (verifica formato)
        run: terraform fmt -check -recursive ../..
        working-directory: ./terraform/environments/dev

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform/environments/dev

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
        working-directory: ./terraform/environments/dev

      - name: Comentar plan en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0,60000) + '...(truncado)' : plan;
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '### Terraform Plan\n```\n' + truncated + '\n```'
            });

      - name: Guardar plan como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: terraform/environments/dev/tfplan
          retention-days: 7

  plan-prod:
    name: Terraform Plan Prod
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    env:
      TF_INPUT: "0"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=truetally-terraform-state" -backend-config="key=prod/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"
        working-directory: ./terraform/environments/prod

      - name: Terraform Workspace
        run: terraform workspace select -or-create prod
        working-directory: ./terraform/environments/prod

      - name: Terraform FMT (verifica formato)
        run: terraform fmt -check -recursive ../..
        working-directory: ./terraform/environments/prod

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform/environments/prod

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan_output.txt
        working-directory: ./terraform/environments/prod

      - name: Comentar plan en el PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0,60000) + '...(truncado)' : plan;
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '### Terraform Plan\n```\n' + truncated + '\n```'
            });

      - name: Guardar plan como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: terraform/environments/prod/tfplan
          retention-days: 7

  apply-dev:
    name: Terraform Apply Dev
    needs: plan-dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=truetally-terraform-state" -backend-config="key=dev/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"
        working-directory: ./terraform/environments/dev

      - name: Terraform Workspace
        run: terraform workspace select -or-create dev
        working-directory: ./terraform/environments/dev

      - name: Descargar plan aprobado
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: terraform/environments/dev/

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: ./terraform/environments/dev

  apply-prod:
    name: Terraform Apply Prod
    needs: plan-prod
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://andrespaganroncall.qzz.io

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=truetally-terraform-state" -backend-config="key=prod/terraform.tfstate" -backend-config="region=${{ secrets.AWS_REGION }}"
        working-directory: ./terraform/environments/prod

      - name: Terraform Workspace
        run: terraform workspace select -or-create prod
        working-directory: ./terraform/environments/prod

      - name: Descargar plan aprobado
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: terraform/environments/prod/

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: ./terraform/environments/prod