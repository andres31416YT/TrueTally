name: Build & Push ECR Images

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/blockchain-core/**'
      - '.github/workflows/ecr-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/blockchain-core/**'
      - '.github/workflows/ecr-build.yml'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: truetally-blockchain
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ECR_REPOSITORY_URI }}/blockchain
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app/blockchain-core
          file: ./app/blockchain-core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref:${{ secrets.ECR_REPOSITORY_URI }}/blockchain:buildcache
          cache-to: type=registry,ref=${{ secrets.ECR_REPOSITORY_URI }}/blockchain:buildcache,mode=max

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.meta.outputs.tags }}"
