name: Build & Push ECR Images

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/blockchain-core/**'
      - 'Dockerfile'
      - '.github/workflows/ecr-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/blockchain-core/**'
      - 'Dockerfile'
      - '.github/workflows/ecr-build.yml'

env:
  AWS_REGION: us-east-1

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR repository URI
        id: ecr
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/truetally-prod-blockchain" >> $GITHUB_OUTPUT
          else
            echo "REPO=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/truetally-dev-blockchain" >> $GITHUB_OUTPUT
          fi

      - name: Set tag
        id: tag
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app/blockchain-core
          file: ./app/blockchain-core/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.REPO }}:${{ steps.tag.outputs.TAG }}
          cache-from: type=registry,ref=${{ steps.ecr.outputs.REPO }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr.outputs.REPO }}:buildcache,mode=max

      - name: Image digest
        run: echo "Image pushed: ${{ steps.ecr.outputs.REPO }}:${{ steps.tag.outputs.TAG }}"
