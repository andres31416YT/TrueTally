name: CI/CD Build

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'app/blockchain-core/**'
      - 'Dockerfile'
      - '.github/workflows/app-build.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'app/blockchain-core/**'
      - 'Dockerfile'
      - '.github/workflows/app-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          REPOSITORY_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/truetally-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}-blockchain"
          IMAGE_TAG="${{ github.sha }}"

          echo "Repository: $REPOSITORY_URI"
          echo "Tag: $IMAGE_TAG"

          docker build -t $REPOSITORY_URI:$IMAGE_TAG ./app/blockchain-core
          docker push $REPOSITORY_URI:$IMAGE_TAG
          docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest
          docker push $REPOSITORY_URI:latest

          echo "image=$REPOSITORY_URI:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: build

      - name: Image pushed
        run: echo "Image ${{ steps.build.outputs.image }} pushed"
