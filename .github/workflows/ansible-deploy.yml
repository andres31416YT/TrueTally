name: Ansible Deploy via SSM

on:
  workflow_run:
    workflows: ['Terraform CI/CD']
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  configure:
    name: Configurar servidores con Ansible
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Instalar Ansible y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.general

      - name: Instalar plugin SSM
        run: |
          curl -s 'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb' \
            -o ssm-plugin.deb
          sudo dpkg -i ssm-plugin.deb || true

      - name: Determinar ambiente y tag
        id: env
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "tag=Environment:prod" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "tag=Environment:dev" >> $GITHUB_OUTPUT
          fi

      - name: Verificar conectividad SSM
        run: |
          aws ssm describe-instance-information \
            --query 'InstanceInformationList[*].[InstanceId,PingStatus]' \
            --output table

      - name: Ejecutar playbook de Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory/aws_ec2.yml \
            --connection=aws_ssm \
            ansible/playbooks/site.yml \
            -v \
            --extra-vars "aws_environment_tag=${{ steps.env.outputs.tag }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
