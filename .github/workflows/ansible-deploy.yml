# Workflow de Ansible
# Se ejecuta automáticamente después que Terraform CI/CD termine exitosamente
# Encargado de configurar la infraestructura aprovisionada por Terraform
name: Ansible Deploy

# Trigger: se dispara cuando el workflow 'Terraform CI/CD' completa exitosamente
# También puede ejecutarse manualmente con workflow_dispatch
on:
  workflow_run:
    workflows: ['Terraform CI/CD']
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

# Permisos necesarios:
# - id-token: write: autenticación OIDC con AWS
# - contents: read: leer el código del repositorio
# - actions: read: leer el estado de otros workflows (workflow_run)
permissions:
  id-token: write
  contents: read
  actions: read

# Job principal: configura toda la infraestructura con Ansible
# Ejecuta el playbook site.yml con los roles definidos en ansible/roles
jobs:
  configure:
    name: Configurar infraestructura con Ansible
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # Paso 1: descargar el código del repositorio
      - name: Checkout del código (último commit de la rama)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # Paso 2: autenticarse con AWS usando OIDC (sin credenciales estáticas)
      - name: Autenticación con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      # Paso 3: instalar Ansible y las colecciones de AWS necesarias
      - name: Instalar Python 3 y Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip jq
          python3 -m pip install --upgrade pip
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.general

      # Paso 4: detectar si estamos en main (prod) o develop (dev)
      - name: Determinar ambiente
        id: env
        run: |
          if [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "truetally_env=prod" >> $GITHUB_OUTPUT
          else
            echo "truetally_env=dev" >> $GITHUB_OUTPUT
          fi

      # Paso 5: ejecutar el playbook principal de Ansible
      # - ANSIBLE_ROLES_PATH: ruta donde están los roles personalizados
      # - inventario: hosts.ini (servidores EC2, ECS, Lambda, etc.)
      # - extra-vars: variable truetally_env (dev o prod)
      - name: Ejecutar playbook de Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.ini \
            ansible/playbooks/site.yml \
            -v \
            --extra-vars "truetally_env=${{ steps.env.outputs.truetally_env }} ansible_python_interpreter=/usr/bin/python3"
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
          ANSIBLE_ROLES_PATH: ansible/roles
          ANSIBLE_CONFIG: ansible/playbooks/ansible.cfg
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          SUDOADMIN_EMAIL: ${{ secrets.SUDOADMIN_EMAIL }}
          SUDOADMIN_PASSWORD: ${{ secrets.SUDOADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      # Paso 6: firmar y desplegar Lambdas Rust desde artifacts de Terraform
      - name: Download Lambda artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-artifacts
          path: terraform/artifacts

      - name: Create S3 signing bucket
        run: |
          BUCKET="truetally-dev-signing-${{ github.run_id }}"
          aws s3 mb s3://$BUCKET --region ${{ secrets.AWS_REGION }}
          echo "BUCKET=$BUCKET" >> $GITHUB_ENV

      - name: Upload ZIPs for signing
        run: |
          for zip in terraform/artifacts/lambda-acceso.zip terraform/artifacts/lambda-despachador.zip terraform/artifacts/lambda-procesador.zip; do
            NAME=$(basename "$zip" .zip)
            aws s3 cp "$zip" "s3://${{ env.BUCKET }}/$NAME.zip"
          done

      - name: Start signing jobs
        run: |
          for lambda in lambda-acceso lambda-despachador lambda-procesador; do
            VERSION=$(aws s3api list-object-versions \
              --bucket ${{ env.BUCKET }} \
              --prefix "$lambda.zip" \
              --query 'Versions[0].VersionId' \
              --output text)

            aws signer start-signing-job \
              --source "s3={bucketName=${{ env.BUCKET }},key=$lambda.zip,version=$VERSION}" \
              --destination "s3={bucketName=${{ env.BUCKET }},prefix=signed/}" \
              --profile-name truetallydevlambdasigningprofile \
              --region ${{ secrets.AWS_REGION }} \
              --output json > "/tmp/signing_$lambda.json"

            JOB_ID=$(python3 -c "import json; print(json.load(open('/tmp/signing_$lambda.json'))['jobId'])")
            echo "$lambda=$JOB_ID" >> $GITHUB_ENV
          done

      - name: Wait for signing jobs
        run: |
          for i in {1..60}; do
            ALL_DONE=true
            for lambda in lambda-acceso lambda-despachador lambda-procesador; do
              JOB_ID=$(grep "^$lambda=" $GITHUB_ENV | cut -d'=' -f2)
              STATUS=$(aws signer get-signing-job \
                --job-id "$JOB_ID" \
                --region ${{ secrets.AWS_REGION }} \
                --query 'status' \
                --output text 2>/dev/null || echo "PENDING")
              echo "$lambda signing status: $STATUS (attempt $i)"
              if [ "$STATUS" = "PENDING" ] || [ "$STATUS" = "IN_PROGRESS" ]; then
                ALL_DONE=false
              elif [ "$STATUS" = "FAILED" ]; then
                echo "Signing failed for $lambda"
                exit 1
              fi
            done
            if [ "$ALL_DONE" = true ]; then
              echo "All signing jobs completed"
              exit 0
            fi
            sleep 5
          done
          echo "Signing jobs timed out"
          exit 1

      - name: Download signed artifacts and deploy
        run: |
          for lambda in lambda-acceso lambda-despachador lambda-procesador; do
            JOB_ID=$(grep "^$lambda=" $GITHUB_ENV | cut -d'=' -f2)
            SIGNED_KEY=$(aws signer get-signing-job \
              --job-id "$JOB_ID" \
              --region ${{ secrets.AWS_REGION }} \
              --query 'signedObject.s3Location.key' \
              --output text)
            echo "Downloading signed $lambda from $SIGNED_KEY"
            aws s3 cp "s3://${{ env.BUCKET }}/$SIGNED_KEY" "$lambda-signed.zip"

            if [ "${{ steps.env.outputs.truetally_env }}" == "prod" ]; then
              LAMBDA_NAME="truetally-prod-$lambda"
            else
              LAMBDA_NAME="truetally-dev-$lambda"
            fi
            echo "Deploying $LAMBDA_NAME..."
            aws lambda update-function-code \
              --function-name "$LAMBDA_NAME" \
              --zip-file fileb://$lambda-signed.zip \
              --region ${{ secrets.AWS_REGION }}
          done

      - name: Cleanup bucket
        if: always()
        run: |
          aws s3 rb s3://${{ env.BUCKET }} --force || true
