name: Lambda Deploy

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/lambda-acceso/**'
      - 'app/lambda-despachador/**'
      - 'app/lambda-procesador/**'
      - 'app/shared/**'
      - '.github/workflows/lambda-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambdas:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      SIGNING_PROFILE: truetallydevlambdasigningprofile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            app/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock', 'app/Cargo.toml', 'app/shared/Cargo.toml', 'app/lambda-acceso/Cargo.toml', 'app/lambda-despachador/Cargo.toml', 'app/lambda-procesador/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build and package Lambdas
        run: |
          cd app
          for lambda in lambda-acceso lambda-despachador lambda-procesador; do
            echo "Building $lambda..."
            cargo build --release -p "$lambda"
            cp "target/release/bootstrap" "$lambda.zip"
            echo "Created $lambda.zip"
          done

      - name: Create S3 signing bucket
        run: |
          BUCKET="truetally-dev-signing-${{ github.run_id }}"
          aws s3 mb s3://$BUCKET --region ${{ env.AWS_REGION }}
          echo "BUCKET=$BUCKET" >> $GITHUB_ENV

      - name: Upload ZIPs for signing
        run: |
          for lambda in lambda-acceso lambda-despachador lambda-procesador; do
            aws s3 cp "app/$lambda.zip" "s3://${{ env.BUCKET }}/$lambda.zip"
          done

      - name: Start signing jobs
        run: |
          for lambda in lambda-acceso lambda-despachador lambda-procesador; do
            VERSION=$(aws s3api list-object-versions \
              --bucket ${{ env.BUCKET }} \
              --prefix "$lambda.zip" \
              --query 'Versions[0].VersionId' \
              --output text)

            aws signer start-signing-job \
              --source "s3={bucketName=${{ env.BUCKET }},key=$lambda.zip,version=$VERSION}" \
              --destination "s3={bucketName=${{ env.BUCKET }},prefix=signed/}" \
              --profile-name ${{ env.SIGNING_PROFILE }} \
              --region ${{ env.AWS_REGION }} \
              --output json > "/tmp/signing_$lambda.json"

            JOB_ID=$(python3 -c "import json; print(json.load(open('/tmp/signing_$lambda.json'))['jobId'])")
            echo "$lambda=$JOB_ID" >> $GITHUB_ENV
          done

      - name: Wait for signing jobs
        run: |
          for i in {1..60}; do
            ALL_DONE=true
            for lambda in lambda-acceso lambda-despachador lambda-procesador; do
              JOB_ID=$(grep "^$lambda=" $GITHUB_ENV | cut -d'=' -f2)
              STATUS=$(aws signer get-signing-job \
                --job-id "$JOB_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'status' \
                --output text 2>/dev/null || echo "PENDING")
              echo "$lambda signing status: $STATUS (attempt $i)"
              if [ "$STATUS" = "PENDING" ] || [ "$STATUS" = "IN_PROGRESS" ]; then
                ALL_DONE=false
              elif [ "$STATUS" = "FAILED" ]; then
                echo "Signing failed for $lambda"
                exit 1
              fi
            done
            if [ "$ALL_DONE" = true ]; then
              echo "All signing jobs completed"
              exit 0
            fi
            sleep 5
          done
          echo "Signing jobs timed out"
          exit 1

      - name: Download signed artifacts and deploy
        run: |
          for lambda in lambda-acceso lambda-despachador lambda-procesador; do
            JOB_ID=$(grep "^$lambda=" $GITHUB_ENV | cut -d'=' -f2)
            SIGNED_KEY=$(aws signer get-signing-job \
              --job-id "$JOB_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'signedObject.s3Location.key' \
              --output text)
            echo "Downloading signed $lambda from $SIGNED_KEY"
            aws s3 cp "s3://${{ env.BUCKET }}/$SIGNED_KEY" "$lambda-signed.zip"

            if [ "${{ github.ref }}" == "refs/heads/main" ]; then
              LAMBDA_NAME="truetally-prod-$lambda"
            else
              LAMBDA_NAME="truetally-dev-$lambda"
            fi
            echo "Deploying $LAMBDA_NAME..."
            aws lambda update-function-code \
              --function-name "$LAMBDA_NAME" \
              --zip-file fileb://$lambda-signed.zip \
              --region ${{ env.AWS_REGION }}
          done

      - name: Cleanup bucket
        if: always()
        run: |
          aws s3 rb s3://${{ env.BUCKET }} --force || true
