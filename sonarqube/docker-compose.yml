services:
  truetally-sonarqube:
    image: sonarqube:community
    container_name: truetally-sonarqube
    depends_on:
      - truetally-sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://truetally-sonarqube-db:5432/truetally_sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - truetally_sonarqube_data:/opt/sonarqube/data
      - truetally_sonarqube_extensions:/opt/sonarqube/extensions
      - truetally_sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  truetally-sonarqube-db:
    image: postgres:16
    container_name: truetally-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: truetally_sonarqube
    volumes:
      - truetally_postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  truetally_sonarqube_data:
  truetally_sonarqube_extensions:
  truetally_sonarqube_logs:
  truetally_postgresql_data:
