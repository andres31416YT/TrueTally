---
- name: Deploy Database and Redis
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../../group_vars/all.yml"

  tasks:
    - name: Apply database schema via RDS Proxy
      amazon.aws.rds_exec_sql:
        db_instance_identifier: "{{ name_prefix }}-aurora-instance-1"
        db_parameter_group_name: "{{ name_prefix }}-aurora-params"
        region: "{{ aws_region }}"
        sql: "SELECT 1"
      register: db_health
      ignore_errors: true

    - name: Verify Redis connectivity
      amazon.aws.elasticache_info:
        cluster_id: "{{ name_prefix }}-redis"
        region: "{{ aws_region }}"
      register: redis_info
