---
- name: Configurar infraestructura TrueTally
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - group_vars/all.yml

  pre_tasks:
    - name: Validar variables de ambiente
      assert:
        that:
          - environment is defined
          - aws_region is defined
        fail_msg: "Faltan variables: environment={{ environment }} aws_region={{ aws_region }}"

  roles:
    - role: lambda
      tags: [lambdas]
    - role: ecs
      tags: [ecs]
    - role: database
      tags: [database]
    - role: frontend
      tags: [frontend]
