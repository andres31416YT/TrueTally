---
# =============================================================================
# PLAYBOOK PRINCIPAL DE ANSIBLE - TrueTally
# =============================================================================
# Configura toda la infraestructura aprovisionada por Terraform:
# - Base de datos (RDS PostgreSQL + ElastiCache Redis)
# - Nodo blockchain (ECS Fargate)
# - API Gateway (integraciones Lambda)
# - Lambdas (acceso, despachador, procesador)
# - Frontend (Next.js desplegado en S3 + CloudFront)
# - WAF (protección OWASP para CloudFront)
# - SQS DLQ (cola de mensajes muertos)
# - Route53 (configuración DNS)
# - VPC Endpoints (S3, SQS, Secrets Manager)
# - VPC Flow Logs (auditoría de tráfico)
# - SES (servicio de email)
# =============================================================================

- name: Configurar infraestructura TrueTally
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_aws_profile: "{{ lookup('env', 'ANSIBLE_AWS_PROFILE', default='') }}"
  pre_tasks:
    - name: Set AWS_PROFILE env only if defined
      set_fact:
        aws_env: "{{ {'AWS_PROFILE': ansible_aws_profile} if ansible_aws_profile else {} }}"
  environment: "{{ aws_env }}"

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/lambda.yml
    - ../group_vars/ecs_blockchain.yml

  pre_tasks:
    - name: Validar variables de ambiente
      tags: [validate]
      assert:
        that:
          - truetally_env is defined
          - aws_region is defined
        fail_msg: "Faltan variables: truetally_env={{ truetally_env }} aws_region={{ aws_region }}"

    - name: Obtener VPC ID desde AWS
      tags: [database]
      shell: |
        aws ec2 describe-vpcs --filters "Name=tag:Name,Values={{ name_prefix }}-vpc" --query 'Vpcs[0].VpcId' --output text --region "{{ aws_region }}"
      register: vpc_id_result

    - name: Obtener subnets privadas (compute + database)
      tags: [database]
      shell: |
        aws ec2 describe-subnets --filters "Name=vpc-id,Values={{ vpc_id_result.stdout }}" "Name=tag:Name,Values={{ name_prefix }}-compute-*,{{ name_prefix }}-database-*" --query 'Subnets[].SubnetId' --output json --region "{{ aws_region }}"
      register: private_subnets_result

    - name: Obtener subnets de blockchain
      tags: [database]
      shell: |
        aws ec2 describe-subnets --filters "Name=vpc-id,Values={{ vpc_id_result.stdout }}" "Name=tag:Name,Values={{ name_prefix }}-blockchain-*" --query 'Subnets[].SubnetId' --output json --region "{{ aws_region }}"
      register: blockchain_subnets_result

    - name: Obtener security group de Lambda
      tags: [database]
      shell: |
        aws ec2 describe-security-groups --filters "Name=vpc-id,Values={{ vpc_id_result.stdout }}" "Name=group-name,Values={{ name_prefix }}-lambda-sg" --query 'SecurityGroups[0].GroupId' --output text --region "{{ aws_region }}"
      register: lambda_sg_result

    - name: Obtener CloudFront Distribution ID
      tags: [frontend]
      shell: |
        aws cloudfront list-distributions --query "DistributionList.Items[?length(Origins.Items[?contains(DomainName, '{{ frontend.s3_bucket }}.s3.amazonaws.com')]) > \`0\`].Id | [0]" --output text --region "{{ aws_region }}"
      register: cf_dist_id_result

    - name: Establecer variables dinámicas
      tags: [database]
      set_fact:
        vpc_id: "{{ vpc_id_result.stdout }}"
        private_subnet_ids: "{{ private_subnets_result.stdout | from_json }}"
        blockchain_subnet_ids: "{{ blockchain_subnets_result.stdout | from_json }}"
        lambda_security_group_id: "{{ lambda_sg_result.stdout }}"
        cloudfront_distribution_id: "{{ cf_dist_id_result.stdout }}"

  roles:
    - role: database
      tags: [database]

    - role: vpc_endpoints
      tags: [network]

    - role: ecs
      tags: [ecs]

    - role: api_gateway
      tags: [api_gateway]

    - role: lambda
      tags: [lambda]

    - role: frontend
      tags: [frontend]

    - role: waf
      tags: [waf]

    - role: sqs_dlq
      tags: [sqs]

    - role: route53
      tags: [route53]

    - role: vpc_flow_logs
      tags: [network]

    - role: ses
      tags: [ses]

    - role: blockchain-monitoring
      tags: [monitoring]
