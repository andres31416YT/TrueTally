---
- name: Deploy Frontend to S3 + CloudFront
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../../group_vars/all.yml"

  tasks:
    - name: Build frontend for static export
      shell: |
        cd {{ playbook_dir }}/../../app/frontend && \
        NEXT_PUBLIC_API_URL={{ api_gateway_url | default('') }} npm run build
      args:
        chdir: "{{ playbook_dir }}/../../app/frontend"

    - name: Sync frontend to S3
      amazon.aws.s3_sync:
        bucket: "{{ name_prefix }}-frontend"
        file_root: "{{ playbook_dir }}/../../app/frontend/out"
        pcre: true
        delete: true
        cache_control: "max-age=31536000, immutable"
      register: s3_sync

    - name: Create CloudFront invalidation
      amazon.aws.cloudfront_distribution:
        distribution_id: "{{ frontend_cloudfront_id | default('') }}"
        invalidation_batch:
          paths:
            - "/*"
          caller_reference: "{{ ansible_date_time.epoch }}"
      when: frontend_cloudfront_id | default('') != ''
      register: cf_invalidation
