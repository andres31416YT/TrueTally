[defaults]
# Ruta donde se encuentran los roles personalizados de Ansible
# Los roles (database, ecs, api_gateway, lambda, frontend) están en ansible/roles/
roles_path = ../roles

# Deshabilitar verificación de host keys (no aplica para conexiones locales/AWS)
host_key_checking = False

# Inventario por defecto (se puede sobrescribir con -i)
inventory = ./
