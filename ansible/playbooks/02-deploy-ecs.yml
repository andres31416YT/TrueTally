---
- name: Deploy ECS Blockchain Node
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../../group_vars/all.yml"

  tasks:
    - name: Build and push blockchain Docker image
      amazon.aws.ecr_image:
        repository_name: "{{ name_prefix }}-blockchain"
        region: "{{ aws_region }}"
        tag: latest
        scan_on_push: true
        source_path: "{{ playbook_dir }}/../../app/blockchain-core"
        dockerfile: "{{ playbook_dir }}/../../app/blockchain-core/Dockerfile"

    - name: Register ECS Task Definition with sidecar
      amazon.aws.ecs_taskdefinition:
        family: "{{ name_prefix }}-blockchain"
        state: present
        network_mode: awsvpc
        task_role_arn: "{{ ecs_task_role_arn | default('') }}"
        execution_role_arn: "{{ ecs_task_execution_role_arn | default('') }}"
        containers:
          - name: blockchain-node
            image: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ name_prefix }}-blockchain:latest"
            essential: true
            portMappings:
              - containerPort: 9944
                hostPort: 9944
                protocol: tcp
            mountPoints:
              - sourceVolume: blockchain-data
                containerPath: /data/db
            logConfiguration:
              logDriver: awslogs
              options:
                awslogs-group: "/ecs/{{ name_prefix }}-blockchain"
                awslogs-region: "{{ aws_region }}"
                awslogs-stream-prefix: blockchain
            environment:
              - name: PORT
                value: "9944"
              - name: RUST_LOG
                value: "blockchain_core=info"
          - name: node-exporter
            image: prom/node-exporter:latest
            essential: false
            portMappings:
              - containerPort: 9100
                hostPort: 9100
                protocol: tcp
            logConfiguration:
              logDriver: awslogs
              options:
                awslogs-group: "/ecs/{{ name_prefix }}-blockchain"
                awslogs-region: "{{ aws_region }}"
                awslogs-stream-prefix: exporter
        volumes:
          - name: blockchain-data
            efs_volume_configuration:
              file_system_id: "{{ efs_id | default('') }}"
        tags:
          Project: "{{ project_name }}"
          Environment: "{{ environment }}"
          Component: "ecs-blockchain"

    - name: Ensure ECS Service is running
      amazon.aws.ecs_service:
        cluster: "{{ name_prefix }}-blockchain-cluster"
        service_name: "{{ name_prefix }}-blockchain-service"
        task_definition: "{{ name_prefix }}-blockchain"
        desired_count: 2
        launch_type: FARGATE
        network_configuration:
          subnets: "{{ blockchain_subnet_ids | default([]) }}"
          securityGroups:
            - "{{ ecs_security_group_id | default('') }}"
          assignPublicIp: false
        load_balancers:
          - target_group_arn: "{{ target_group_arn | default('') }}"
            container_name: blockchain-node
            container_port: 9944
        tags:
          Project: "{{ project_name }}"
          Environment: "{{ environment }}"
          Component: "ecs-blockchain"
