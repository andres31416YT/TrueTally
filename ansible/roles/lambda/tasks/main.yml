---
- name: Obtener credenciales de DB desde Secrets Manager
  shell: |
    aws secretsmanager get-secret-value \
      --secret-id "{{ name_prefix }}/db/credentials" \
      --query 'SecretString' \
      --output text \
      --region "{{ aws_region }}"
  register: db_secret_raw

- name: Obtener endpoint de RDS
  shell: |
    aws rds describe-db-instances --db-instance-identifier "{{ name_prefix }}-postgres" --query 'DBInstances[0].Endpoint.Address' --output text --region "{{ aws_region }}"
  register: rds_endpoint_raw

- name: Parsear credenciales de DB
  set_fact:
    db_username: "{{ db_secret_raw.stdout | from_json | json_query('username') }}"
    db_password: "{{ db_secret_raw.stdout | from_json | json_query('password') }}"
    db_endpoint: "{{ rds_endpoint_raw.stdout }}"
    db_port: 5432

- name: Construir DATABASE_URL
  shell: |
    python3 -c "from urllib.parse import quote; print('postgres://{{ db_username }}:' + quote('{{ db_password }}', safe='') + '@{{ db_endpoint }}:{{ db_port }}/truetally')"
  register: database_url_result

- name: Obtener IP del nodo blockchain desde ECS
  shell: |
    TASK_ARN=$(aws ecs list-tasks --cluster "{{ name_prefix }}-blockchain-cluster" --service-name "{{ name_prefix }}-blockchain-service" --query 'taskArns[0]' --output text --region "{{ aws_region }}")
    if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
      aws ecs describe-tasks --cluster "{{ name_prefix }}-blockchain-cluster" --tasks "$TASK_ARN" --query 'tasks[0].attachments[0].details[?name==`privateIPv4Address`].value | [0]' --output text --region "{{ aws_region }}"
    else
      echo "unknown"
    fi
  register: blockchain_ip_result

- name: Establecer URL del nodo blockchain
  set_fact:
    blockchain_node_url: >-
      {% if blockchain_ip_result.stdout and blockchain_ip_result.stdout != '' and blockchain_ip_result.stdout != 'None' %}
      http://{{ blockchain_ip_result.stdout }}:9944
      {% endif %}

- name: Obtener URL de la cola SQS
  shell: |
    aws sqs get-queue-url --queue-name "{{ name_prefix }}-vote-queue" --query 'QueueUrl' --output text --region "{{ aws_region }}"
  register: sqs_queue_url_result

- name: Obtener variables actuales de lambda-acceso
  shell: |
    aws lambda get-function-configuration \
      --function-name "{{ name_prefix }}-acceso" \
      --region "{{ aws_region }}" \
      --query 'Environment.Variables' \
      --output json
  register: lambda_acceso_env_raw

- name: Obtener variables actuales de lambda-procesador
  shell: |
    aws lambda get-function-configuration \
      --function-name "{{ name_prefix }}-procesador" \
      --region "{{ aws_region }}" \
      --query 'Environment.Variables' \
      --output json
  register: lambda_procesador_env_raw

- name: Obtener variables actuales de lambda-despachador
  shell: |
    aws lambda get-function-configuration \
      --function-name "{{ name_prefix }}-despachador" \
      --region "{{ aws_region }}" \
      --query 'Environment.Variables' \
      --output json
  register: lambda_despachador_env_raw

- name: Calcular variables fusionadas para lambda-acceso
  set_fact:
    lambda_acceso_new_env: >-
      {{ (lambda_acceso_env_raw.stdout | from_json | combine({
        'DATABASE_URL': database_url_result.stdout,
        'SUDOADMIN_EMAIL': sudoadmin_email,
        'SUDOADMIN_PASSWORD': sudoadmin_password,
        'ADMIN_EMAIL': admin_email,
        'ADMIN_PASSWORD': admin_password
      }) | combine({
        'BLOCKCHAIN_NODE_URL': blockchain_node_url
      } if blockchain_node_url else {})) | to_json }}

- name: Calcular variables fusionadas para lambda-procesador
  set_fact:
    lambda_procesador_new_env: >-
      {{ (lambda_procesador_env_raw.stdout | from_json | combine({
        'SUDOADMIN_EMAIL': sudoadmin_email,
        'SUDOADMIN_PASSWORD': sudoadmin_password,
        'ADMIN_EMAIL': admin_email,
        'ADMIN_PASSWORD': admin_password
      }) | combine({
        'BLOCKCHAIN_NODE_URL': blockchain_node_url
      } if blockchain_node_url else {})) | to_json }}

- name: Calcular variables fusionadas para lambda-despachador
  set_fact:
    lambda_despachador_new_env: >-
      {{ (lambda_despachador_env_raw.stdout | from_json | combine({
        'SUDOADMIN_EMAIL': sudoadmin_email,
        'SUDOADMIN_PASSWORD': sudoadmin_password,
        'ADMIN_EMAIL': admin_email,
        'ADMIN_PASSWORD': admin_password
      }) | combine({
        'VOTE_QUEUE_URL': sqs_queue_url_result.stdout
      } if sqs_queue_url_result.stdout else {})) | to_json }}

- name: Escribir variables fusionadas para lambda-acceso
  copy:
    content: "{{ lambda_acceso_new_env }}"
    dest: /tmp/lambda_acceso_vars.json

- name: Escribir variables fusionadas para lambda-procesador
  copy:
    content: "{{ lambda_procesador_new_env }}"
    dest: /tmp/lambda_procesador_vars.json

- name: Escribir variables fusionadas para lambda-despachador
  copy:
    content: "{{ lambda_despachador_new_env }}"
    dest: /tmp/lambda_despachador_vars.json

- name: Crear script de actualización Lambda
  copy:
    content: |
      import json
      import subprocess
      import sys

      function_name = sys.argv[1]
      region = sys.argv[2]
      variables_file = sys.argv[3]

      with open(variables_file, 'r') as f:
          variables = json.load(f)

      config = {
          'FunctionName': function_name,
          'Environment': {
              'Variables': variables
          }
      }

      with open('/tmp/lambda_config.json', 'w') as f:
          json.dump(config, f)

      result = subprocess.run([
          'aws', 'lambda', 'update-function-configuration',
          '--cli-input-json', 'file:///tmp/lambda_config.json',
          '--region', region
      ], capture_output=True, text=True)

      print(result.stdout)
      if result.returncode != 0:
          print(result.stderr, file=sys.stderr)
          sys.exit(1)
    dest: /tmp/update_lambda.py

- name: Actualizar lambda-acceso
  shell: python3 /tmp/update_lambda.py "{{ name_prefix }}-acceso" "{{ aws_region }}" /tmp/lambda_acceso_vars.json

- name: Actualizar lambda-procesador
  shell: python3 /tmp/update_lambda.py "{{ name_prefix }}-procesador" "{{ aws_region }}" /tmp/lambda_procesador_vars.json

- name: Actualizar lambda-despachador
  shell: python3 /tmp/update_lambda.py "{{ name_prefix }}-despachador" "{{ aws_region }}" /tmp/lambda_despachador_vars.json
