---
# =============================================================================
# ROLE: blockchain-monitoring
# =============================================================================
# Responsabilidades:
# - Configurar CloudWatch log groups para ECS
# - Configurar alarmas de CloudWatch para el nodo blockchain
# =============================================================================

- name: Create CloudWatch log group para blockchain
  shell: |
    aws logs create-log-group --log-group-name "/ecs/{{ name_prefix }}-blockchain" --retention-in-days {{ monitoring.log_retention_days }} --region "{{ aws_region }}" 2>/dev/null || true

- name: Configurar alarma de CPU
  shell: |
    aws cloudwatch put-metric-alarm --alarm-name "{{ name_prefix }}-blockchain-cpu-high" --alarm-description "Alarma cuando CPU del blockchain supera 80%" --metric-name CPUUtilization --namespace AWS/ECS --statistic Average --period 300 --threshold 80 --comparison-operator GreaterThanThreshold --dimensions Name=ServiceName,Value={{ name_prefix }}-blockchain-service Name=ClusterName,Value={{ name_prefix }}-blockchain-cluster --evaluation-periods 2 --region {{ aws_region }} 2>/dev/null || true

- name: Configurar alarma de memoria
  shell: |
    aws cloudwatch put-metric-alarm --alarm-name "{{ name_prefix }}-blockchain-memory-high" --alarm-description "Alarma cuando memoria del blockchain supera 80%" --metric-name MemoryUtilization --namespace AWS/ECS --statistic Average --period 300 --threshold 80 --comparison-operator GreaterThanThreshold --dimensions Name=ServiceName,Value={{ name_prefix }}-blockchain-service Name=ClusterName,Value={{ name_prefix }}-blockchain-cluster --evaluation-periods 2 --region {{ aws_region }} 2>/dev/null || true

- name: Configurar alarma de health check
  shell: |
    aws cloudwatch put-metric-alarm --alarm-name "{{ name_prefix }}-blockchain-health" --alarm-description "Alarma cuando el servicio blockchain está unhealthy" --metric-name UnHealthyHostCount --namespace AWS/ApplicationELB --statistic Average --period 60 --threshold 1 --comparison-operator GreaterThanOrEqualToThreshold --evaluation-periods 2 --region {{ aws_region }} 2>/dev/null || true