              "reduceCalc": "last",
              "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"value": null, "color": "green"}]}}}
            },
            {
              "id": 4,
              "title": "Volumen de logs por job (lineas/5m)",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 6, "w": 12, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(count_over_time({job=~\".+\"}[5m])) by (job)"}],
              "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 20, "stacking": {"mode": "normal"}}}}
            },
            {
              "id": 5,
              "title": "Volumen de logs por funcion (lineas/5m)",
              "type": "timeseries",
              "gridPos": {"x": 12, "y": 6, "w": 12, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(count_over_time({job=~\".+\"}[5m])) by (function)"}],
              "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 20, "stacking": {"mode": "normal"}}}}
            },
            {
              "id": 6,
              "title": "Tasa de errores por job (errores/min)",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 14, "w": 12, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(rate({job=~\".+\"} |~ \"(?i)(error|panic|exception|fail)\" [5m])) by (job) * 60"}],
              "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}}
            },
            {
              "id": 7,
              "title": "Actividad del nodo blockchain (lineas/5m)",
              "type": "timeseries",
              "gridPos": {"x": 12, "y": 14, "w": 12, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(count_over_time({job=\"blockchain\"}[5m]))", "legendFormat": "blockchain-node"}],
              "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 25}}}
            },
            {
              "id": 8,
              "title": "Distribucion de logs por job (1h)",
              "type": "piechart",
              "gridPos": {"x": 0, "y": 22, "w": 8, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(count_over_time({job=~\".+\"}[1h])) by (job)", "instant": true}]
            },
            {
              "id": 9,
              "title": "Distribucion de logs por funcion (1h)",
              "type": "piechart",
              "gridPos": {"x": 8, "y": 22, "w": 8, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(count_over_time({job=~\".+\"}[1h])) by (function)", "instant": true}]
            },
            {
              "id": 10,
              "title": "Top funciones por volumen (1h)",
              "type": "bargauge",
              "gridPos": {"x": 16, "y": 22, "w": 8, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "topk(8, sum(count_over_time({job=~\".+\"}[1h])) by (function))", "instant": true}],
              "fieldConfig": {"defaults": {"unit": "short"}}
            },
            {
              "id": 11,
              "title": "Throughput de ingesta (bytes/s) por job",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 30, "w": 12, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(bytes_rate({job=~\".+\"}[5m])) by (job)"}],
              "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "fillOpacity": 10}}}
            },
            {
              "id": 12,
              "title": "Volumen de logs por log_group (1h)",
              "type": "table",
              "gridPos": {"x": 12, "y": 30, "w": 12, "h": 8},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(count_over_time({job=~\".+\"}[1h])) by (log_group)", "instant": true}]
            }
          ],
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "30s"
        },
        "overwrite": true
      }

- name: Crear dashboard Loki Avanzado en Grafana  # noqa: command-instead-of-module
  shell: |
    curl -s -o /tmp/grafana-resp.json -w "%{http_code}" \
      -u "{{ grafana_user }}:{{ grafana_password }}" \
      -X POST "{{ grafana_url }}/api/dashboards/db" \
      -H "Content-Type: application/json" \
      -d @/tmp/grafana-dashboard-loki-advanced.json
  register: dash_loki_adv_status
  ignore_errors: true

# =============================================================================
# Limpieza de dashboards redundantes
# =============================================================================
# Dashboards de logs crudos (paneles tipo "logs") y dashboards de prueba
# manuales que quedaron huerfanos en Grafana: crear un dashboard nuevo via
# la API no borra los viejos, asi que hay que eliminarlos explicitamente.
# Se buscan por titulo (idempotente: si ya no existen, no hace nada).
- name: Buscar UID de dashboards redundantes a eliminar
  shell: |
    curl -s -u "{{ grafana_user }}:{{ grafana_password }}" \
      "{{ grafana_url }}/api/search?query={{ item | urlencode }}&type=dash-db" \
      | jq -r --arg t "{{ item }} - {{ name_prefix }}" '.[] | select(.title == $t) | .uid' | head -n1
  loop:
    - "Logs - Blockchain"
    - "Logs - Lambdas"
    - "Loki Test"
    - "Prometheus Test"
  register: redundant_dashboard_uids
  changed_when: false
  ignore_errors: true

- name: Eliminar dashboards redundantes en Grafana  # noqa: command-instead-of-module
  shell: |
    curl -s -o /dev/null -w "%{http_code}" \
      -u "{{ grafana_user }}:{{ grafana_password }}" \
      -X DELETE "{{ grafana_url }}/api/dashboards/uid/{{ item.stdout }}"
  loop: "{{ redundant_dashboard_uids.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout is defined and item.stdout | trim | length > 0
  register: dash_cleanup_status
  ignore_errors: true

- name: Mostrar informacion de acceso al stack de observabilidad
  debug:
    msg:
      - "=============================================="
      - "STACK DE OBSERVABILIDAD DESPLEGADO"
      - "=============================================="
      - "Grafana URL: {{ grafana_url }}"
      - "Usuario: {{ grafana_user }}"
      - "Password: {{ grafana_password }}"
      - "Loki URL (interno): http://loki.{{ truetally_env }}.truetally.internal:3100"
      - "Prometheus URL (interno): http://{{ prometheus_ip_result.stdout }}:9090"
      - "=============================================="
      - "Dashboards creados:"
      - "  - ECS Blockchain: {{ dash_blockchain_status.stdout | default('N/A') }}"
      - "  - Lambdas: {{ dash_lambda_status.stdout | default('N/A') }}"
      - "  - SQS: {{ dash_sqs_status.stdout | default('N/A') }}"
      - "  - RDS PostgreSQL: {{ dash_rds_status.stdout | default('N/A') }}"
      - "  - Observability Stack: {{ dash_stack_status.stdout | default('N/A') }}"
      - "  - Prometheus Avanzado: {{ dash_prometheus_adv_status.stdout | default('N/A') }}"
      - "  - Loki Avanzado: {{ dash_loki_adv_status.stdout | default('N/A') }}"
      - "=============================================="
      - "Dashboards redundantes eliminados: {{ dash_cleanup_status.results | default([]) | selectattr('stdout', 'defined') | map(attribute='item.item') | list }}"
      - "=============================================="
      - "Data Sources configurados:"
      - "  - CloudWatch: {{ ds_cloudwatch_status.stdout | default('N/A') }}"
      - "  - Loki: {{ ds_loki_status.stdout | default('N/A') }}"
      - "  - Prometheus: {{ ds_prometheus_status.stdout | default('N/A') }}"
      - "=============================================="
