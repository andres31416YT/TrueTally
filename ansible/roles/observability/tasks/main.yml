- name: Preparar dashboard Logs - Blockchain
  copy:
    dest: /tmp/grafana-dashboard-logs-blockchain.json
    content: |
      {
        "dashboard": {
          "title": "Logs - Blockchain - {{ name_prefix }}",
          "tags": ["truetally", "logs", "loki", "blockchain"],
          "timezone": "browser",
          "panels": [
            {
              "id": 1,
              "title": "Log Volume por funcion Lambda",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 0, "w": 24, "h": 6},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}",
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(count_over_time({job=\"lambda\"}[5m])) by (function)"
                }
              ],
              "yaxes": [{"format": "short"}, {"format": "short"}]
            },
            {
              "id": 2,
              "title": "Logs de aplicacion blockchain",
              "type": "logs",
              "gridPos": {"x": 0, "y": 6, "w": 24, "h": 14},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "expr": "{job=\"blockchain\"} |= \"\" !~ \"^(START |END |REPORT |INIT_START |REPORT RequestId)\" | line_format \"{{ .logGroup | regexp \"/ecs/.+blockchain.+\" | replace \"/ecs/.+blockchain.+\" \"blockchain-node\" | regexp \"/aws/lambda/\" | replace \"/aws/lambda/\" \"\" | regexp \"^([^_]+)_\" | replace \"^([^_]+)_\" \"$1\" | regexp \"^([a-z]+)\" | replace \"^([a-z]+)\" \"$1\" }}\""
                }
              ]
            }
          ],
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "30s"
        },
        "overwrite": true
      }

