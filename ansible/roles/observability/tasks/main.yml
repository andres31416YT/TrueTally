- name: Preparar dashboard Prometheus Avanzado
  copy:
    dest: /tmp/grafana-dashboard-prometheus-advanced.json
    content: |
      {
        "dashboard": {
          "title": "Prometheus Avanzado - {{ name_prefix }}",
          "tags": ["truetally", "prometheus", "observability", "advanced"],
          "timezone": "browser",
          "panels": [
            {
              "id": 1,
              "title": "Targets Up",
              "type": "stat",
              "gridPos": {"x": 0, "y": 0, "w": 8, "h": 6},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(up)"}],
              "reduceCalc": "last",
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {"mode": "absolute", "steps": [{"value": null, "color": "green"}]},
                  "color": {"mode": "thresholds"}
                }
              }
            },
            {
              "id": 2,
              "title": "Targets Totales",
              "type": "stat",
              "gridPos": {"x": 8, "y": 0, "w": 8, "h": 6},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "count(up)"}],
              "reduceCalc": "last",
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {"mode": "absolute", "steps": [{"value": null, "color": "blue"}]},
                  "color": {"mode": "thresholds"}
                }
              }
            },
            {
              "id": 3,
              "title": "Scrape Health (%)",
              "type": "stat",
              "gridPos": {"x": 16, "y": 0, "w": 8, "h": 6},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "avg(up) * 100"}],
              "reduceCalc": "last",
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "min": 0,
                  "max": 100,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"value": 0, "color": "red"},
                      {"value": 99.9, "color": "yellow"},
                      {"value": 100, "color": "green"}
                    ]
                  },
                  "color": {"mode": "thresholds"}
                }
              }
            },
            {
              "id": 4,
              "title": "Estado de targets (up)",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 6, "w": 12, "h": 8},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "up", "legendFormat": "{% raw %}{{job}}{% endraw %}"}],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "min": 0,
                  "max": 1,
                  "custom": {"drawStyle": "line", "lineInterpolation": "stepAfter", "fillOpacity": 10}
                }
              }
            },
            {
              "id": 5,
              "title": "Duracion de scrape por job",
              "type": "timeseries",
              "gridPos": {"x": 12, "y": 6, "w": 12, "h": 8},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "scrape_duration_seconds", "legendFormat": "{% raw %}{{job}}{% endraw %}"}],
              "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 10}}}
            },
            {
              "id": 6,
              "title": "Goroutines por job",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 14, "w": 12, "h": 8},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "go_goroutines", "legendFormat": "{% raw %}{{job}}{% endraw %}"}],
              "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 10}}}
            },
            {
              "id": 7,
              "title": "Uso de CPU (%) por job",
              "type": "timeseries",
              "gridPos": {"x": 12, "y": 14, "w": 12, "h": 8},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "rate(process_cpu_seconds_total[5m]) * 100", "legendFormat": "{% raw %}{{job}}{% endraw %}"}],
              "fieldConfig": {"defaults": {"unit": "percent", "custom": {"drawStyle": "line", "fillOpacity": 10}}}
            },
            {
              "id": 8,
              "title": "Memoria Prometheus (RSS)",
              "type": "gauge",
              "gridPos": {"x": 0, "y": 22, "w": 8, "h": 6},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "process_resident_memory_bytes{job=\"prometheus\"}"}],
              "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}}
            },
            {
              "id": 9,
              "title": "Memoria Loki (RSS)",
              "type": "gauge",
              "gridPos": {"x": 8, "y": 22, "w": 8, "h": 6},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "process_resident_memory_bytes{job=\"loki\"}"}],
              "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}}
            },
            {
              "id": 10,
              "title": "TSDB Head Series",
              "type": "stat",
              "gridPos": {"x": 16, "y": 22, "w": 8, "h": 6},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "prometheus_tsdb_head_series"}],
              "reduceCalc": "last",
              "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"value": null, "color": "blue"}]}}}
            },
            {
              "id": 11,
              "title": "Tasa de ingesta TSDB (samples/s)",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 28, "w": 12, "h": 8},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "rate(prometheus_tsdb_head_samples_appended_total[5m])"}],
              "fieldConfig": {"defaults": {"unit": "short", "custom": {"drawStyle": "line", "fillOpacity": 15}}}
            },
            {
              "id": 12,
              "title": "Tasa de ingesta Loki (bytes/s)",
              "type": "timeseries",
              "gridPos": {"x": 12, "y": 28, "w": 12, "h": 8},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(rate(loki_distributor_bytes_received_total[5m]))"}],
              "fieldConfig": {"defaults": {"unit": "Bps", "custom": {"drawStyle": "line", "fillOpacity": 15}}}
            },
            {
              "id": 13,
              "title": "Latencia de requests a Loki (heatmap)",
              "type": "heatmap",
              "gridPos": {"x": 0, "y": 36, "w": 12, "h": 8},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "sum(rate(loki_request_duration_seconds_bucket[5m])) by (le)", "format": "heatmap", "legendFormat": "{% raw %}{{le}}{% endraw %}"}],
              "options": {"calculate": false},
              "fieldConfig": {"defaults": {"unit": "s"}}
            },
            {
              "id": 14,
              "title": "Latencia Loki p50 / p95 / p99",
              "type": "timeseries",
              "gridPos": {"x": 12, "y": 36, "w": 12, "h": 8},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [
                {"refId": "A", "expr": "histogram_quantile(0.50, sum(rate(loki_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p50"},
                {"refId": "B", "expr": "histogram_quantile(0.95, sum(rate(loki_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95"},
                {"refId": "C", "expr": "histogram_quantile(0.99, sum(rate(loki_request_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p99"}
              ],
              "fieldConfig": {"defaults": {"unit": "s", "custom": {"drawStyle": "line", "fillOpacity": 5}}}
            },
            {
              "id": 15,
              "title": "Muestras por scrape (por job)",
              "type": "table",
              "gridPos": {"x": 0, "y": 44, "w": 24, "h": 7},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [{"refId": "A", "expr": "scrape_samples_scraped", "format": "table", "instant": true}]
            }
          ],
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "30s"
        },
        "overwrite": true
      }

