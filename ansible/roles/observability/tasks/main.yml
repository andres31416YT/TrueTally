- name: Preparar dashboard Observabilidad Stack
  copy:
    dest: /tmp/grafana-dashboard-observability.json
    content: |
      {
        "dashboard": {
          "title": "Observability Stack - {{ name_prefix }}",
          "tags": ["truetally", "observability"],
          "timezone": "browser",
          "panels": [
            {
              "id": 1,
              "title": "Up Jobs (Prometheus)",
              "type": "stat",
              "gridPos": {"x": 0, "y": 0, "w": 8, "h": 6},
              "datasource": {"type": "prometheus", "uid": "{{ ds_prometheus_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "expr": "count(up == 1)"
                }
              ],
              "reduceCalc": "last",
              "pluginVersion": "10.2.2",
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"value": null, "color": "green"}
                    ]
                  },
                  "color": {
                    "mode": "thresholds"
                  }
                }
              }
            },
            {
              "id": 2,
              "title": "ECS Running Tasks",
              "type": "stat",
              "gridPos": {"x": 8, "y": 0, "w": 8, "h": 6},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/ECS",
                  "metricName": "RunningTaskCount",
                  "dimensions": {"ClusterName": "{{ name_prefix }}-blockchain-cluster"},
                  "statistics": ["Average"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ],
              "reduceCalc": "last",
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"value": 0, "color": "red"},
                      {"value": 1, "color": "green"}
                    ]
                  },
                  "color": {
                    "mode": "thresholds"
                  }
                }
              }
            },
            {
              "id": 3,
              "title": "Lambda Errors",
              "type": "timeseries",
              "gridPos": {"x": 16, "y": 0, "w": 8, "h": 6},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/Lambda",
                  "metricName": "Errors",
                  "dimensions": {"FunctionName": "truetally-dev-acceso"},
                  "statistics": ["Sum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                },
                {
                  "refId": "B",
                  "namespace": "AWS/Lambda",
                  "metricName": "Errors",
                  "dimensions": {"FunctionName": "truetally-dev-despachador"},
                  "statistics": ["Sum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                },
                {
                  "refId": "C",
                  "namespace": "AWS/Lambda",
                  "metricName": "Errors",
                  "dimensions": {"FunctionName": "truetally-dev-procesador"},
                  "statistics": ["Sum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "short",
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"value": 0, "color": "green"},
                      {"value": 1, "color": "red"}
                    ]
                  },
                  "color": {
                    "mode": "thresholds"
                  }
                }
              }
            },
            {
              "id": 4,
              "title": "SQS Messages",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 6, "w": 8, "h": 6},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/SQS",
                  "metricName": "NumberOfMessagesSent",
                  "dimensions": {"QueueName": "truetally-dev-vote-queue"},
                  "statistics": ["Sum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                },
                {
                  "refId": "B",
                  "namespace": "AWS/SQS",
                  "metricName": "NumberOfMessagesReceived",
                  "dimensions": {"QueueName": "truetally-dev-vote-queue"},
                  "statistics": ["Sum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                },
                {
                  "refId": "C",
                  "namespace": "AWS/SQS",
                  "metricName": "ApproximateNumberOfMessagesVisible",
                  "dimensions": {"QueueName": "truetally-dev-vote-queue"},
                  "statistics": ["Average"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ],
              "yaxes": [{"format": "short"}, {"format": "short"}]
            },
            {
              "id": 5,
              "title": "Log Volume (Loki)",
              "type": "timeseries",
              "gridPos": {"x": 8, "y": 6, "w": 16, "h": 6},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "expr": "sum(count_over_time({job=~\".+\"}[5m]))"
                }
              ],
              "yaxes": [{"format": "short"}, {"format": "short"}]
            },
            {
              "id": 6,
              "title": "Blockchain Logs (Loki)",
              "type": "logs",
              "gridPos": {"x": 0, "y": 12, "w": 24, "h": 10},
              "datasource": {"type": "loki", "uid": "{{ ds_loki_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "expr": "{job=\"blockchain\"}"
                }
              ]
            }
          ],
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "30s"
        },
        "overwrite": true
      }

