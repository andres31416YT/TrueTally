---
# =============================================================================
# ROLE: observability
# =============================================================================
# Responsabilidades:
# - Obtener informacion de acceso al stack de observabilidad (Grafana)
# - Configurar data sources y dashboards de Grafana via HTTP API
# - Mostrar credenciales y URLs de acceso
# =============================================================================

- name: Obtener DNS del ALB de Grafana
  shell: |
    aws elbv2 describe-load-balancers \
      --query "LoadBalancers[?contains(DNSName, 'truetally-{{ truetally_env }}-grafana-alb')].DNSName | [0]" \
      --output text \
      --region "{{ aws_region }}"
  register: grafana_alb_dns_result

- name: Establecer URL de Grafana
  set_fact:
    grafana_url: "http://{{ grafana_alb_dns_result.stdout }}"

- name: Validar credenciales de Grafana
  assert:
    that:
      - grafana_user | length > 0
      - grafana_password | length > 0
    fail_msg: "Faltan GRAFANA_USER o GRAFANA_PASSWORD. Verifica los secrets en GitHub Actions."
    quiet: true

- name: Obtener IP de la task de Prometheus
  shell: |
    TASK_ARN=$(aws ecs list-tasks --cluster "{{ name_prefix }}-observability-cluster" --service-name "{{ name_prefix }}-observability-prometheus" --query 'taskArns[0]' --output text --region "{{ aws_region }}")
    if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
      aws ecs describe-tasks --cluster "{{ name_prefix }}-observability-cluster" --tasks "$TASK_ARN" --query 'tasks[0].attachments[0].details[?name==`privateIPv4Address`].value | [0]' --output text --region "{{ aws_region }}"
    else
      echo "unknown"
    fi
  register: prometheus_ip_result

- name: Esperar que Grafana este disponible
  uri:
    url: "{{ grafana_url }}/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 10

- name: Preparar payload CloudWatch datasource
  copy:
    dest: /tmp/grafana-ds-cloudwatch.json
    content: |
      {
        "name": "CloudWatch",
        "type": "cloudwatch",
        "access": "proxy",
        "url": "https://monitoring.{{ aws_region }}.amazonaws.com",
        "isDefault": false,
        "jsonData": {
          "authType": "default",
          "defaultRegion": "{{ aws_region }}"
        }
      }

- name: Crear data source CloudWatch en Grafana  # noqa: command-instead-of-module
  shell: |
    curl -s -o /tmp/grafana-resp.json -w "%{http_code}" \
      -u "{{ grafana_user }}:{{ grafana_password }}" \
      -X POST "{{ grafana_url }}/api/datasources" \
      -H "Content-Type: application/json" \
      -d @/tmp/grafana-ds-cloudwatch.json
  register: ds_cloudwatch_status
  ignore_errors: true

- name: Preparar payload Loki datasource
  copy:
    dest: /tmp/grafana-ds-loki.json
    content: |
      {
        "name": "Loki",
        "type": "loki",
        "access": "proxy",
        "url": "http://loki.{{ truetally_env }}.truetally.internal:3100",
        "isDefault": false
      }

- name: Crear data source Loki en Grafana  # noqa: command-instead-of-module
  shell: |
    curl -s -o /tmp/grafana-resp.json -w "%{http_code}" \
      -u "{{ grafana_user }}:{{ grafana_password }}" \
      -X POST "{{ grafana_url }}/api/datasources" \
      -H "Content-Type: application/json" \
      -d @/tmp/grafana-ds-loki.json
  register: ds_loki_status
  ignore_errors: true

- name: Preparar payload Prometheus datasource
  copy:
    dest: /tmp/grafana-ds-prometheus.json
    content: |
      {
        "name": "Prometheus",
        "type": "prometheus",
        "access": "proxy",
        "url": "http://prometheus.{{ truetally_env }}.truetally.internal:9090",
        "isDefault": true
      }

- name: Crear data source Prometheus en Grafana  # noqa: command-instead-of-module
  shell: |
    curl -s -o /tmp/grafana-resp.json -w "%{http_code}" \
      -u "{{ grafana_user }}:{{ grafana_password }}" \
      -X POST "{{ grafana_url }}/api/datasources" \
      -H "Content-Type: application/json" \
      -d @/tmp/grafana-ds-prometheus.json
  register: ds_prometheus_status
  ignore_errors: true

- name: Obtener UID del data source Prometheus  # noqa: command-instead-of-module
  shell: |
    curl -s -u "{{ grafana_user }}:{{ grafana_password }}" "{{ grafana_url }}/api/datasources" | jq -r '.[] | select(.name=="Prometheus") | .uid'
  register: ds_prometheus_uid_cmd
  ignore_errors: true
  changed_when: false

- name: Actualizar URL del data source Prometheus (DNS estable)  # noqa: command-instead-of-module
  shell: |
    curl -s -o /tmp/grafana-resp.json -w "%{http_code}" \
      -u "{{ grafana_user }}:{{ grafana_password }}" \
      -X PUT "{{ grafana_url }}/api/datasources/uid/{{ ds_prometheus_uid_cmd.stdout }}" \
      -H "Content-Type: application/json" \
      -d '{"id":0,"uid":"{{ ds_prometheus_uid_cmd.stdout }}","name":"Prometheus","type":"prometheus","access":"proxy","url":"http://prometheus.{{ truetally_env }}.truetally.internal:9090","isDefault":true}'
  register: ds_prometheus_update_status
  ignore_errors: true

- name: Obtener UID de data sources  # noqa: command-instead-of-module
  shell: |
    curl -s -u "{{ grafana_user }}:{{ grafana_password }}" "{{ grafana_url }}/api/datasources" | jq -r '.[] | "\(.name) \(.uid)"'
  register: grafana_datasources_cmd
  ignore_errors: true
  changed_when: false

- name: Extraer UIDs de data sources
  set_fact:
    ds_cloudwatch_uid: "{{ (grafana_datasources_cmd.stdout_lines | select('search', '^CloudWatch ') | list | first | default('')).split(' ') | last | default('') }}"
    ds_loki_uid: "{{ (grafana_datasources_cmd.stdout_lines | select('search', '^Loki ') | list | first | default('')).split(' ') | last | default('') }}"
    ds_prometheus_uid: "{{ (grafana_datasources_cmd.stdout_lines | select('search', '^Prometheus ') | list | first | default('')).split(' ') | last | default('') }}"
  failed_when: false

- name: Preparar dashboard ECS Blockchain
  copy:
    dest: /tmp/grafana-dashboard-blockchain.json
    content: |
      {
        "dashboard": {
          "title": "ECS Blockchain - {{ name_prefix }}",
          "tags": ["truetally", "ecs", "blockchain"],
          "timezone": "browser",
          "panels": [
            {
              "id": 1,
              "title": "CPU Utilization (%)",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/ECS",
                  "metricName": "CPUUtilization",
                  "dimensions": {"ClusterName": "{{ name_prefix }}-blockchain-cluster"},
                  "statistics": ["Average", "Maximum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "min": 0,
                  "max": 100,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"value": 0, "color": "green"},
                      {"value": 70, "color": "yellow"},
                      {"value": 90, "color": "red"}
                    ]
                  }
                }
              }
            },
            {
              "id": 2,
              "title": "Memory Utilization (%)",
              "type": "timeseries",
              "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/ECS",
                  "metricName": "MemoryUtilization",
                  "dimensions": {"ClusterName": "{{ name_prefix }}-blockchain-cluster"},
                  "statistics": ["Average", "Maximum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "min": 0,
                  "max": 100,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"value": 0, "color": "green"},
                      {"value": 70, "color": "yellow"},
                      {"value": 90, "color": "red"}
                    ]
                  }
                }
              }
            },
            {
              "id": 3,
              "title": "Network In/Out (bytes)",
              "type": "timeseries",
              "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/ECS",
                  "metricName": "NetworkRxBytes",
                  "dimensions": {"ClusterName": "{{ name_prefix }}-blockchain-cluster"},
                  "statistics": ["Sum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                },
                {
                  "refId": "B",
                  "namespace": "AWS/ECS",
                  "metricName": "NetworkTxBytes",
                  "dimensions": {"ClusterName": "{{ name_prefix }}-blockchain-cluster"},
                  "statistics": ["Sum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes",
                  "custom": {
                    "scale": {"type": "byte"}
                  }
                }
              }
            },
            {
              "id": 4,
              "title": "Service Events",
              "type": "table",
              "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/ECS",
                  "metricName": "ServiceEvents",
                  "dimensions": {
                    "ClusterName": "{{ name_prefix }}-blockchain-cluster",
                    "ServiceName": "{{ name_prefix }}-blockchain-service"
                  },
                  "statistics": ["Sum"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ]
            },
            {
              "id": 5,
              "title": "Running / Pending Tasks",
              "type": "stat",
              "gridPos": {"x": 0, "y": 16, "w": 12, "h": 6},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/ECS",
                  "metricName": "RunningTaskCount",
                  "dimensions": {"ClusterName": "{{ name_prefix }}-blockchain-cluster"},
                  "statistics": ["Average"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                },
                {
                  "refId": "B",
                  "namespace": "AWS/ECS",
                  "metricName": "PendingTaskCount",
                  "dimensions": {"ClusterName": "{{ name_prefix }}-blockchain-cluster"},
                  "statistics": ["Average"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ],
              "reduceCalc": "last",
              "fieldConfig": {
                "defaults": {
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"value": 0, "color": "red"},
                      {"value": 1, "color": "green"}
                    ]
                  },
                  "color": {
                    "mode": "thresholds"
                  }
                }
              }
            },
            {
              "id": 6,
              "title": "Service Health",
              "type": "stat",
              "gridPos": {"x": 12, "y": 16, "w": 12, "h": 6},
              "datasource": {"type": "cloudwatch", "uid": "{{ ds_cloudwatch_uid }}"},
              "targets": [
                {
                  "refId": "A",
                  "namespace": "AWS/ECS",
                  "metricName": "HealthCheckStatus",
                  "dimensions": {
                    "ClusterName": "{{ name_prefix }}-blockchain-cluster",
                    "ServiceName": "{{ name_prefix }}-blockchain-service"
                  },
                  "statistics": ["Average"],
                  "period": "300",
                  "region": "{{ aws_region }}"
                }
              ],
              "reduceCalc": "last",
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    {"type": "value", "value": "0", "text": "Unhealthy", "color": "red"},
                    {"type": "value", "value": "1", "text": "Healthy", "color": "green"}
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {"value": 0, "color": "red"},
                      {"value": 1, "color": "green"}
                    ]
                  },
                  "color": {
                    "mode": "thresholds"
                  }
                }
              }
            }
          ],
          "time": {"from": "now-6h", "to": "now"},
          "refresh": "30s"
        },
        "overwrite": true
      }

- name: Crear dashboard ECS Blockchain en Grafana  # noqa: command-instead-of-module
  shell: |
