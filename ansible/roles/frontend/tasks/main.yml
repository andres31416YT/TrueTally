---
- name: Obtener URL del API Gateway
  shell: |
    aws apigatewayv2 get-apis --query "Items[?Name=='{{ name_prefix }}-api'].ApiId | [0]" --output text --region "{{ aws_region }}"
  register: api_id_result

- name: Establecer API Gateway URL
  set_fact:
    api_gateway_url: "https://{{ api_id_result.stdout }}.execute-api.{{ aws_region }}.amazonaws.com"

- name: Build frontend con API_URL correcto
  shell: |
    export NEXT_PUBLIC_API_URL="{{ api_gateway_url }}"
    npm ci
    npm run build
  args:
    chdir: ../../app/frontend

- name: Sincronizar frontend a S3
  shell: |
    aws s3 sync ../../app/frontend/{{ frontend.dist_directory }} s3://{{ frontend.s3_bucket }} --delete --cache-control "max-age=31536000" --metadata-directive REPLACE

- name: Restaurar acceso público al bucket S3
  shell: |
    aws s3api put-public-access-block --bucket "{{ frontend.s3_bucket }}" --public-access-block-configuration '{"BlockPublicAcls":false,"IgnorePublicAcls":false,"BlockPublicPolicy":false,"RestrictPublicBuckets":false}'
    aws s3api put-bucket-policy --bucket "{{ frontend.s3_bucket }}" --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":"s3:GetObject","Resource":"arn:aws:s3:::{{ frontend.s3_bucket }}/*"}]}'

- name: Invalidar CloudFront asociado al bucket frontend
  shell: |
    DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[].DomainName, \`{{ frontend.s3_bucket }}.s3.\`)].Id | [0]" --output text --region "{{ aws_region }}")
    if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
      aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --region "{{ aws_region }}"
    fi
