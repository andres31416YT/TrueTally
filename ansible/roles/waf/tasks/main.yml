---
# =============================================================================
# ROLE: waf
# =============================================================================
# Responsabilidades:
# - Crear Web ACL con reglas OWASP Core Rule Set (CRS)
# - Configurar rate limiting para proteger contra abuso
# - Asociar WAF al CloudFront distribution del frontend
# =============================================================================

- name: Crear archivo de configuración WAF con reglas JSON
  copy:
    content: "{{ waf_rules_json }}"
    dest: /tmp/waf-rules.json

- name: Crear o reutilizar Web ACL para CloudFront
  # Evita WAFDuplicateItemException si el Web ACL ya existe de despliegues anteriores
  # Verifica primero con list-web-acls y solo crea si no existe
  shell: |
    WEB_ACL_ARN=$(aws wafv2 list-web-acls \
      --scope CLOUDFRONT \
      --region "{{ aws_region }}" \
      --query "WebACLs[?Name=='{{ name_prefix }}-waf'].ARN | [0]" \
      --output text)
    if [ "$WEB_ACL_ARN" = "None" ] || [ -z "$WEB_ACL_ARN" ]; then
      aws wafv2 create-web-acl \
        --name "{{ name_prefix }}-waf" \
        --scope CLOUDFRONT \
        --region "{{ aws_region }}" \
        --default-action 'Allow={}' \
        --visibility-config 'SampledRequestsEnabled=true,CloudWatchMetricsEnabled=true,MetricName={{ name_prefix }}-waf' \
        --rules file:///tmp/waf-rules.json \
        --tags '[{"Key":"Project","Value":"{{ project_name }}"},{"Key":"Environment","Value":"{{ truetally_env }}"},{"Key":"ManagedBy","Value":"ansible"}]' \
        --query 'WebACL.Arn' \
        --output text
    else
      echo "$WEB_ACL_ARN"
    fi
  register: web_acl_arn
  ignore_errors: true