---
# =============================================================================
# ROLE: waf
# =============================================================================

- name: Obtener CloudFront Distribution ID
  shell: |
    aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[].DomainName, '{{ frontend.s3_bucket }}.s3.')].Id | [0]" --output text --region "{{ aws_region }}"
  register: cf_dist_result

- name: Crear Web ACL con reglas OWASP si no existe
  shell: |
    aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 --query "WebACLs[?Name=='{{ name_prefix }}-waf'].ARN | [0]" --output text | grep -v None || aws wafv2 create-web-acl --name "{{ name_prefix }}-waf" --scope CLOUDFRONT --region us-east-1 --default-action Allow={} --visibility-config SampledRequestsEnabled=true,CloudWatchMetricsEnabled=true,MetricName="{{ name_prefix }}-waf" --rules '[{"Name":"AWSManagedRulesCommonRuleSet","Priority":0,"Statement":{"ManagedRuleGroupStatement":{"VendorName":"AWS","Name":"AWSManagedRulesCommonRuleSet"}},"VisibilityConfig":{"SampledRequestsEnabled":true,"CloudWatchMetricsEnabled":true,"MetricName":"AWSManagedRulesCommonRuleSet"}},{"Name":"AWSManagedRulesSQLiRuleSet","Priority":1,"Statement":{"ManagedRuleGroupStatement":{"VendorName":"AWS","Name":"AWSManagedRulesSQLiRuleSet"}},"VisibilityConfig":{"SampledRequestsEnabled":true,"CloudWatchMetricsEnabled":true,"MetricName":"AWSManagedRulesSQLiRuleSet"}},{"Name":"RateLimitRule","Priority":2,"Statement":{"RateBasedStatement":{"Limit":1000,"AggregateKeyType":"IP"}},"VisibilityConfig":{"SampledRequestsEnabled":true,"CloudWatchMetricsEnabled":true,"MetricName":"RateLimitRule"}}]' --tags '[{"Key":"Project","Value":"{{ project_name }}"},{"Key":"Environment","Value":"{{ truetally_env }}"},{"Key":"ManagedBy","Value":"ansible"}]' --query 'WebACL.Arn' --output text
  register: web_acl_arn
  ignore_errors: true

- name: Asociar WAF a CloudFront
  shell: |
    aws wafv2 get-web-acl-for-resource --resource-arn "arn:aws:cloudfront::{{ aws_account_id }}:distribution/{{ cf_dist_result.stdout }}" --region us-east-1 --query 'WebACL.Arn' --output text 2>/dev/null | grep -v None || aws wafv2 associate-web-acl --web-acl-arn "{{ web_acl_arn.stdout }}" --resource-arn "arn:aws:cloudfront::{{ aws_account_id }}:distribution/{{ cf_dist_result.stdout }}" --region us-east-1
  ignore_errors: true