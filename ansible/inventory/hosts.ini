# =============================================================================
# INVENTARIO DE ANSIBLE - TrueTally
# =============================================================================
# Grupos de hosts locales (CI/CD y herramientas auxiliares)
# Se ejecutan en la máquina local del runner via connection=local
# =============================================================================

[local:children]
# Grupo padre que incluye todos los hosts locales
ci
local_tools

# Host local para ejecutar comandos AWS CLI y tareas de despliegue
[ci]
localhost ansible_connection=local

# Herramientas auxiliares locales (scripts, validaciones)
[local_tools]
localhost ansible_connection=local

# =============================================================================
# GRUPO DE LAMBDAS (manejadas via conexión AWS Lambda)
# =============================================================================
# Se conecta directamente a las funciones Lambda vía ansible_connection=aws_lambda
# NO son hosts EC2, son funciones serverless
# =============================================================================

[lambda:children]
# Agrupa los tres tipos de Lambda del proyecto
lambda_acceso
lambda_despachador
lambda_procesador

[lambda_acceso]
# Lambda de acceso/autenticación - maneja registro y login de usuarios
lambda-acceso-az1
lambda-acceso-az2

[lambda_despachador]
# Lambda despachador - recibe votos de la API Gateway y los envía a la cola SQS
lambda-despachador-az1
lambda-despachador-az2

[lambda_procesador]
# Lambda procesador - consume votos de SQS y los escribe en la blockchain
lambda-procesador-az1
lambda-procesador-az2

# =============================================================================
# GRUPO ECS BLOCKCHAIN (manejado localmente via AWS CLI)
# =============================================================================
# El nodo blockchain corre en ECS Fargate, no es un host SSH
# Las tareas se administran desde el runner local usando aws ecs CLI
# =============================================================================

[ecs_blockchain]
blockchain-node-az1
blockchain-node-az2

# =============================================================================
# VARIABLES POR GRUPO
# =============================================================================

[lambda:vars]
# Configuración de conexión para todas las Lambdas
ansible_connection = aws_lambda
ansible_aws_region = us-east-1

[ecs_blockchain:vars]
# El servicio ECS se administra desde el runner local
ansible_connection = local
ansible_aws_region = us-east-1

[all:vars]
# Variables globales aplicables a todos los hosts
ansible_python_interpreter = /usr/bin/python3
ansible_aws_region = us-east-1
