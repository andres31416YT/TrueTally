# Ansible Inventory - TrueTally Infrastructure
# Este inventory representa los componentes de AWS como "hosts" lógicos

[local:children]
ci
local_tools

[ci]
localhost ansible_connection=local

[local_tools]
localhost ansible_connection=local

# AWS Lambda Functions (agrupadas por componente)
[lambda_acceso]
lambda-acceso-az1
lambda-acceso-az2

[lambda_despachador]
lambda-despachador-az1
lambda-despachador-az2

[lambda_procesador]
lambda-procesador-az1
lambda-procesador-az2

[lambda:children]
lambda_acceso
lambda_despachador
lambda_procesador

# ECS / Blockchain
[ecs_blockchain]
blockchain-node-az1
blockchain-node-az2

# Variables de conexión para Lambda (vía AWS CLI)
[lambda:vars]
ansible_connection = aws_lambda
ansible_aws_region  = us-east-1

[ecs_blockchain:vars]
ansible_connection = local
ansible_aws_region  = us-east-1

# Variables generales
[all:vars]
ansible_python_interpreter = /usr/bin/env python3
environment = "{{ lookup('env', 'ENVIRONMENT') | default('dev') }}"
aws_region  = "{{ lookup('env', 'AWS_REGION') | default('us-east-1') }}"