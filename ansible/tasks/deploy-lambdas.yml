---
# Tasks para deploy de Lambdas en AWS Lambda

- name: Package Lambda binaries
  run_once: true
  delegate_to: localhost
  block:
    - name: Verify bootstrap binaries exist
      stat:
        path: "../../../app/target/release/bootstrap"
      register: bootstrap_check

    - name: Fail if bootstrap not found
      fail:
        msg: "Lambda binaries not found. Run cargo build --release first."
      when: not bootstrap_check.stat.exists

- name: Update Lambda Acceso AZ1
  amazon.aws.lambda_function:
    name: "{{ name_prefix }}-acceso-az1"
    state: present
    runtime: provided.al2
    handler: bootstrap
    role: "{{ lambda_role_arn }}"
    timeout: 30
    memory_size: 512
    filename: "../../../app/target/release/bootstrap"
    vpc_subnet_ids: "{{ compute_subnet_ids }}"
    vpc_security_group_ids: ["{{ lambda_security_group_id }}"]
    environment_variables:
      DATABASE_URL: "{{ rds_proxy_endpoint }}"
      BLOCKCHAIN_NODE_URL: "{{ lambda_node_url_az1 }}"
      PORT: "8080"
    reserved_concurrency: 5
    tags: "{{ common_tags }}"
  register: lambda_acceso_az1

- name: Update Lambda Acceso AZ2
  amazon.aws.lambda_function:
    name: "{{ name_prefix }}-acceso-az2"
    state: present
    runtime: provided.al2
    handler: bootstrap
    role: "{{ lambda_role_arn }}"
    timeout: 30
    memory_size: 512
    filename: "../../../app/target/release/bootstrap"
    vpc_subnet_ids: "{{ compute_subnet_ids }}"
    vpc_security_group_ids: ["{{ lambda_security_group_id }}"]
    environment_variables:
      DATABASE_URL: "{{ rds_proxy_endpoint }}"
      BLOCKCHAIN_NODE_URL: "{{ lambda_node_url_az2 }}"
      PORT: "8080"
    reserved_concurrency: 5
    tags: "{{ common_tags }}"
  register: lambda_acceso_az2

- name: Update Lambda Despachador AZ1
  amazon.aws.lambda_function:
    name: "{{ name_prefix }}-despachador-az1"
    state: present
    runtime: provided.al2
    handler: bootstrap
    role: "{{ lambda_role_arn }}"
    timeout: 30
    memory_size: 256
    filename: "../../../app/target/release/bootstrap"
    vpc_subnet_ids: "{{ compute_subnet_ids }}"
    vpc_security_group_ids: ["{{ lambda_security_group_id }}"]
    environment_variables:
      VOTE_QUEUE_URL: "{{ sqs_queue_url }}"
    reserved_concurrency: 5
    tags: "{{ common_tags }}"
  register: lambda_desp_az1

- name: Update Lambda Despachador AZ2
  amazon.aws.lambda_function:
    name: "{{ name_prefix }}-despachador-az2"
    state: present
    runtime: provided.al2
    handler: bootstrap
    role: "{{ lambda_role_arn }}"
    timeout: 30
    memory_size: 256
    filename: "../../../app/target/release/bootstrap"
    vpc_subnet_ids: "{{ compute_subnet_ids }}"
    vpc_security_group_ids: ["{{ lambda_security_group_id }}"]
    environment_variables:
      VOTE_QUEUE_URL: "{{ sqs_queue_url }}"
    reserved_concurrency: 5
    tags: "{{ common_tags }}"
  register: lambda_desp_az2

- name: Update Lambda Procesador AZ1
  amazon.aws.lambda_function:
    name: "{{ name_prefix }}-procesador-az1"
    state: present
    runtime: provided.al2
    handler: bootstrap
    role: "{{ lambda_role_arn }}"
    timeout: 300
    memory_size: 1024
    filename: "../../../app/target/release/bootstrap"
    vpc_subnet_ids: "{{ compute_subnet_ids }}"
    vpc_security_group_ids: ["{{ lambda_security_group_id }}"]
    environment_variables:
      BLOCKCHAIN_NODE_URL: "{{ lambda_node_url_az1 }}"
    reserved_concurrency: 5
    tags: "{{ common_tags }}"
  register: lambda_proc_az1

- name: Update Lambda Procesador AZ2
  amazon.aws.lambda_function:
    name: "{{ name_prefix }}-procesador-az2"
    state: present
    runtime: provided.al2
    handler: bootstrap
    role: "{{ lambda_role_arn }}"
    timeout: 300
    memory_size: 1024
    filename: "../../../app/target/release/bootstrap"
    vpc_subnet_ids: "{{ compute_subnet_ids }}"
    vpc_security_group_ids: ["{{ lambda_security_group_id }}"]
    environment_variables:
      BLOCKCHAIN_NODE_URL: "{{ lambda_node_url_az2 }}"
    reserved_concurrency: 5
    tags: "{{ common_tags }}"
  register: lambda_proc_az2

- name: Configure SQS Event Source Mapping for Procesador AZ1
  amazon.aws.lambda_event_source_mapping:
    event_source_arn: "{{ sqs_queue_url }}"
    function_name: "{{ lambda_proc_az1.arn }}"
    batch_size: 10
    enabled: true

- name: Configure SQS Event Source Mapping for Procesador AZ2
  amazon.aws.lambda_event_source_mapping:
    event_source_arn: "{{ sqs_queue_url }}"
    function_name: "{{ lambda_proc_az2.arn }}"
    batch_size: 10
    enabled: true